<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Hit5 app icon (docs/04 U-26): the game's stopwatch showing 5.00.
       Layers: #bg is the adaptive-icon background, #fg the foreground. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36E"/>
      <stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC300"/>
      <stop offset="1" stop-color="#FF6F00"/>
    </linearGradient>
    <radialGradient id="face" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1ECE4"/>
    </radialGradient>
  </defs>
  <g id="bg">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <g fill="#FFFFFF" opacity="0.18">
      <circle cx="170" cy="190" r="26"/><circle cx="860" cy="250" r="18"/>
      <circle cx="120" cy="820" r="16"/><circle cx="900" cy="860" r="28"/>
    </g>
  </g>
  <g id="fg" stroke-linejoin="round">
    <!-- crown and side button -->
    <rect x="462" y="196" width="100" height="70" rx="18" fill="url(#gold)" stroke="#2B2D42" stroke-width="18"/>
    <rect x="432" y="166" width="160" height="50" rx="22" fill="url(#gold)" stroke="#2B2D42" stroke-width="18"/>
    <rect x="726" y="262" width="74" height="52" rx="18" fill="url(#gold)" stroke="#2B2D42" stroke-width="18" transform="rotate(42 763 288)"/>
    <!-- shadow, body, face -->
    <circle cx="512" cy="584" r="300" fill="#2B2D42" opacity="0.22"/>
    <circle cx="512" cy="560" r="300" fill="#FFFFFF" stroke="#2B2D42" stroke-width="22"/>
    <circle cx="512" cy="560" r="252" fill="url(#face)"/>
    <!-- progress arc, nearly full: the hit -->
    <circle cx="512" cy="560" r="272" fill="none" stroke="url(#gold)" stroke-width="26"
            stroke-linecap="round" stroke-dasharray="1650 2000" transform="rotate(-90 512 560)"/>
    <!-- ticks -->
    <g stroke="#2B2D42" stroke-width="12" stroke-linecap="round">
      <line x1="512" y1="330" x2="512" y2="362"/><line x1="512" y1="758" x2="512" y2="790"/>
    </g>
    <!-- glossy highlight -->
    <path d="M330 470 A 200 200 0 0 1 560 330" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.9"/>
    <text x="512" y="618" text-anchor="middle" font-family="Paytone One" font-size="165"
          fill="#2B2D42" letter-spacing="-4">5.00</text>
  </g>
</svg>
