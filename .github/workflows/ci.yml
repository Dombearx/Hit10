name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write # attaching APKs to milestone releases

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd app && flutter pub get
      - run: make check
      - name: Balance simulation (docs/03 §3, §5)
        run: make sim

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "../hit10-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hit10-apk
          path: hit10-*.apk
          retention-days: 30

  # Its own runner: building the AAB right after the APK on one runner got
  # the runner shut down twice, which held back the APK release.
  aab:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The Play upload (docs/05 §9): signed with the upload key and built
      # with the real AdMob ids — but only when those secrets exist, and
      # never for the APKs above, which are for testing on our own phones
      # (T-28: never tap your own real ads). versionCode = CI run number,
      # so every upload is higher than the last.
      - name: Build AAB
        env:
          KEYSTORE_B64: ${{ secrets.HIT10_KEYSTORE_B64 }}
          HIT10_KEYSTORE_PASSWORD: ${{ secrets.HIT10_KEYSTORE_PASSWORD }}
          HIT10_KEY_ALIAS: ${{ secrets.HIT10_KEY_ALIAS }}
          HIT10_KEY_PASSWORD: ${{ secrets.HIT10_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          cd app
          flutter pub get
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export HIT10_KEYSTORE="$RUNNER_TEMP/upload.jks"
            signed=signed
          else
            unset ADMOB_APP_ID ADMOB_REWARDED_ID
            signed=unsigned
          fi
          define=()
          [ -n "${ADMOB_REWARDED_ID:-}" ] && define=(--dart-define=ADMOB_REWARDED_ID="$ADMOB_REWARDED_ID")
          flutter build appbundle --release --build-number=${{ github.run_number }} "${define[@]}"
          cp build/app/outputs/bundle/release/app-release.aab "../hit10-${GITHUB_REF_NAME//\//-}-$signed.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: hit10-aab
          path: hit10-*.aab
          retention-days: 30

  # Launches the APK on an Android emulator and plays a round: catches
  # crashes that only happen on a real device (playtest1 crashed at start).
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hit10-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke-out/
          retention-days: 14

  # Only an APK that started and played a round on the emulator is released.
  release:
    needs: [apk, aab, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hit10-apk
      - uses: actions/download-artifact@v4
        with:
          name: hit10-aab
      # On main, the milestone named in MILESTONE gets a tag and a GitHub
      # Release with this APK the first time it appears (docs/07-plan.md).
      - name: Read milestone
        id: milestone
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(tr -d '[:space:]' < MILESTONE)
          echo "name=$m" >> "$GITHUB_OUTPUT"
          if gh release view "$m" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Milestone release
        if: github.ref == 'refs/heads/main' && steps.milestone.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.milestone.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Hit10 ${{ steps.milestone.outputs.name }}
          files: |
            hit10-*.apk
            hit10-*-signed.aab
          body: |
            APK for milestone ${{ steps.milestone.outputs.name }} (docs/07-plan.md),
            plus the signed AAB for Play when the signing secrets are set.
            Install on Android: download the .apk on the phone and allow
            installing from this source when asked.
