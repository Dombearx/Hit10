name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write # attaching APKs to milestone releases

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd app && flutter pub get
      - run: make check
      - name: Balance simulation (docs/03 §3, §5)
        run: make sim

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "../hit10-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hit10-apk
          path: hit10-*.apk
          retention-days: 30
      # On main, the milestone named in MILESTONE gets a tag and a GitHub
      # Release with this APK the first time it appears (docs/07-plan.md).
      - name: Read milestone
        id: milestone
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(tr -d '[:space:]' < MILESTONE)
          echo "name=$m" >> "$GITHUB_OUTPUT"
          if gh release view "$m" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Milestone release
        if: github.ref == 'refs/heads/main' && steps.milestone.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.milestone.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Hit10 ${{ steps.milestone.outputs.name }}
          files: hit10-*.apk
          body: |
            APK for milestone ${{ steps.milestone.outputs.name }} (docs/07-plan.md).
            Install on Android: download the .apk on the phone and allow
            installing from this source when asked.
