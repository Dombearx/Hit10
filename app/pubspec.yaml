name: hit10
description: "Hit10 — tap at exactly 10.00"
publish_to: 'none'

# versionName+versionCode; bumped per release (docs/05-technika.md §9).
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Needed by plugins with web implementations (local notifications).
  flutter_web_plugins:
    sdk: flutter
  flame: ^1.38.2
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_soloud: ^5.2.2
  intl: ^0.20.3
  path_provider: ^2.1.6
  archive: ^4.5.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  google_mobile_ads: ^9.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/balance.json
    - assets/audio/
    - assets/emoji/
    - assets/fonts/OFL-PaytoneOne.txt
    - assets/fonts/OFL-Nunito.txt

  fonts:
    - family: PaytoneOne
      fonts:
        - asset: assets/fonts/PaytoneOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
