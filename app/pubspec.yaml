name: hit10
description: "Hit10 — tap at exactly 10.00"
publish_to: 'none'

# versionName+versionCode; bumped per release (docs/05-technika.md §9).
version: 0.0.1+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.38.2
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_soloud: ^5.2.2
  intl: ^0.20.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/balance.json

  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
